name: Fork Release (arm64 APK)

# Fork 发布线(2026-09-25):上游 android-release.yml 依赖一整套我们没配的 secrets
# (Sentry/Conveyor/双变体矩阵)且只传 artifacts 不建 Release,不适合直接复用。
# 本工作流按 fork 打包定案执行:只打 arm64-v8a full release、跳过 Sentry 上传、
# zipalign+apksigner 手动签名(与本地 build_and_sign 流程一致)、直接创建 GitHub
# Release 并附 APK。所需 secrets:KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS
# / KEY_PASSWORD(已配在 Vandrion/DuoMusic)。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空 = v{version-name}）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & publish arm64 release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > duomusic.jks

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          REL_TAG="${{ inputs.tag }}"
          # tag push 触发时 inputs.tag 为空(仅 workflow_dispatch 有值),取被推的 tag 本名——
          # 否则 beta tag(v*-beta.N)会丢后缀被推导成 v$VERSION,建成正式版(2026-11-16 实证)
          if [ -z "$REL_TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then REL_TAG="${GITHUB_REF_NAME}"; fi
          if [ -z "$REL_TAG" ]; then REL_TAG="v$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rel_tag=$REL_TAG" >> "$GITHUB_OUTPUT"
          echo "rel_name=${REL_TAG#v}" >> "$GITHUB_OUTPUT"
          # beta 分支(dev)发 beta tag(如 v3.13.0-beta.1):Release 标 pre-release;
          # master 正式 tag 无 beta 字样,照常 full release
          if [ "${REL_TAG#*beta}" != "$REL_TAG" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          # beta tag → versionName 注入 tag 后缀(3.13.1-beta.2):app 内可见 beta,且同版本号
          # 正式版发布后,检查更新对 beta 用户能判出(release != current 是字符串比对,数字
          # 部分相同也成立)。正式 tag 后缀为空,versionName 保持干净。
          SUFFIX=$(echo "$REL_TAG" | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+(.*)$/\1/p')
          echo "version_suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION (tag: $REL_TAG)"

      - name: Build arm64 release APK
        run: ./gradlew :androidApp:assembleRelease -x uploadSentryProguardMappingsRelease --console=plain "-PappVersionSuffix=${{ steps.ver.outputs.version_suffix }}"

      - name: Zipalign & sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          SRC="androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release-unsigned.apk"
          test -f "$SRC" || { echo "::error::$SRC not found"; exit 1; }
          OUT="DuoMusic-${{ steps.ver.outputs.rel_tag }}-arm64-release.apk"
          "$BT/zipalign" -f -p 4 "$SRC" "$OUT"
          "$BT/apksigner" sign \
            --ks duomusic.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$OUT"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          ls -lh "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.rel_tag }}
          # workflow_dispatch can run from a non-default branch. Without an explicit target,
          # action-gh-release creates a missing tag on the repository default branch even though
          # the APK above was built from github.sha, leaving the Release tag and binary mismatched.
          target_commitish: ${{ github.sha }}
          name: DuoMusic ${{ steps.ver.outputs.rel_name }}
          files: DuoMusic-*.apk
          # dev 分支的 beta tag(v*-*beta*)自动标 pre-release;master 正式 tag 照常 full release
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
